<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-first work tool. One column, big touch targets, status told by colour + shape. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface2:#e9ebe6; --ink:#16201c; --muted:#5d6a64; --line:#d5d9d2;
  --accent:#0d5c4b; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --ok:#1f7a45; --ok-soft:#dff1e5; --warn:#a15c00; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#fadfdc;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111614; --surface:#1a211e; --surface2:#242d29; --ink:#e9eee9; --muted:#9aa8a1; --line:#334039;
    --accent:#4fc3a5; --accent-ink:#06231b; --accent-soft:#1d3a32;
    --ok:#62c98a; --ok-soft:#173524; --warn:#f0b35a; --warn-soft:#3b2c12; --bad:#ff8a80; --bad-soft:#42201d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111614; --surface:#1a211e; --surface2:#242d29; --ink:#e9eee9; --muted:#9aa8a1; --line:#334039;
  --accent:#4fc3a5; --accent-ink:#06231b; --accent-soft:#1d3a32;
  --ok:#62c98a; --ok-soft:#173524; --warn:#f0b35a; --warn-soft:#3b2c12; --bad:#ff8a80; --bad-soft:#42201d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.15rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:0}
.top .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{color:var(--muted);font-size:.82rem}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;min-height:40px}
main{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.banner{padding:10px 14px;border-radius:var(--r);font-size:.9rem;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.sec span{color:var(--muted);font-size:.85rem}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:52px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.task{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--line);border-radius:var(--r);padding:14px;min-height:64px}
.task.done{border-inline-start-color:var(--ok)} .task.late{border-inline-start-color:var(--bad)} .task.due{border-inline-start-color:var(--warn)}
.task b{display:block} .task small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile .let{font-weight:700;color:var(--accent);font-size:.8rem;letter-spacing:.04em}
.tile b{font-weight:600;line-height:1.25}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:1.7rem;font-weight:700;line-height:1.1} .kpi span{color:var(--muted);font-size:.8rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:.74rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
/* wizard */
.wiz{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.wiz header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.wiz header .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz .prog{height:6px;background:var(--surface2)} .wiz .prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.wiz .body{flex:1;overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%;margin:0 auto}
.wiz .q{font-size:1.55rem;font-weight:600;line-height:1.25;text-wrap:balance}
.wiz .q.long{font-size:1.2rem}
.wiz .hint{color:var(--muted)}
.wiz footer{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);max-width:760px;width:100%;margin:0 auto}
.wiz footer .btn{flex:1}
.big{width:100%;font-size:1.35rem;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-height:64px}
textarea.big{min-height:190px;resize:vertical;line-height:1.4}
.big:focus{border-color:var(--accent);outline:0}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;font-size:1.15rem;font-weight:600;min-height:64px;text-align:center}
.opt.huge{font-size:1.6rem;min-height:120px}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.yes.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.no.on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:46px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.list>*{padding:12px 14px;border-top:1px solid var(--line)} .list>*:first-child{border-top:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad button{font-size:1.5rem;font-weight:600;min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.dots{display:flex;gap:12px;justify-content:center} .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)} .dots i.on{background:var(--accent);border-color:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-width:64px;text-align:center}
.days button b{display:block;font-size:1.1rem} .days button span{font-size:.72rem;color:var(--muted)}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .days button.on span{color:var(--accent-ink)}
.pages{display:flex;flex-direction:column;gap:12px}
.pages img{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
.score{font-size:3rem;font-weight:700;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:.9rem} table.t td,table.t th{padding:8px 6px;border-top:1px solid var(--line);text-align:start;vertical-align:top} table.t th{color:var(--muted);font-weight:600;border-top:0}
.scroll{overflow-x:auto}
[dir="rtl"] .flip{transform:scaleX(-1)}
@media (max-width:400px){.kpis{grid-template-columns:1fr 1fr 1fr}.wiz .q{font-size:1.35rem}}

.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-8px;inset-inline-end:-8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700}
.band{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.82rem}
.band.g{background:var(--ok-soft);color:var(--ok)} .band.a{background:var(--warn-soft);color:var(--warn)} .band.r{background:var(--bad-soft);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><main><div class="card"><b>Loading…</b></div></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>

"use strict";
/* ===================== the form, exactly as written ===================== */
const SECTIONS = [
  ["Performance Review", ["Leadership clear on current MTD sales performance versus target", "Team aware of daily revenue, conversion, ATV and UPT targets", "Performance communicated through daily huddles and trading updates", "Clear and owned plan in place to close any sales gap", "Peak trading hours understood and staffing aligned to commercial opportunity", "Payroll and productive hours managed without compromising consumer experience", "Store P&L and EBIT opportunities reviewed with practical actions"]],
  ["Consumer Experience", ["CREATE | Is the store environment clean, premium and ready to create an extraordinary first impression?", "CREATE | Are customers welcomed warmly and guided through the store in an inclusive, personalised way?", "LEAD | Does the team use thoughtful questions to understand the customer’s environment, intent and physical needs?", "LEAD | Does the team listen actively, confirm understanding and adapt the service to customer cues?", "OFFER | Does the team provide personalised product education linking benefits to the customer’s needs?", "OFFER | Are footwear and apparel try-on rituals delivered with care, attention to detail and clear communication?", "UNLOCK | Does the team uncover additional needs and recommend relevant link, alternative or cross-selling solutions?", "UNLOCK | Are customer hesitations acknowledged, clarified and resolved with confident solutions or fulfilment options?", "DEEPEN | Is the experience closed with a seamless transaction, sincere gratitude, feedback invitation and future connection?", "CLOUD CX COACHING | Is the CLOUD CX Observation App being used, and how many team observations have been completed?"]],
  ["Product & Availability", ["Key styles, best sellers and available sizes represented on the sales floor", "Product gaps and missing sizes understood with actions raised", "New arrivals, seasonal stories and campaign products visible and easy to shop", "Refill completed frequently with stronger routines during peak periods", "Deliveries processed on time and backlog controlled through an action plan", "BOH-to-floor refill routines clear and followed", "Stock counts or RFID routines completed and reports reviewed", "Negative inventory, mismates, defective and obsolete product routines completed", "Product and availability risks shared with Merchandising or Buying"]],
  ["Visual Merchandising", ["Windows and entrance displays aligned to current brand direction", "Magic Wall commercially presented and maintained to standard", "Magic Wall Try On shoes accounted for in the daily count", "Footwear correctly priced and laced to the required standard", "Apparel correctly priced and presented to the required standard", "Accessories correctly displayed, priced and fully replenished"]],
  ["Team & Leadership", ["Clear Leader on Duty visible on the floor", "Leader actively coaching, directing and assigning responsibilities", "Floor coverage protected during peak trading periods", "Team engaged, brand appropriate and clear on current priorities", "Daily huddles, coaching and training completed with commercial focus", "New starters supported with onboarding and individual training goals", "Grooming and uniform standards met", "Team knows how to contact HR and report concerns or hazards", "Strong performance recognised and communicated consistently"]],
  ["Operations & BOH", ["Daily and weekly checklists complete, current and signed", "BOH clean and free from dust, waste and unnecessary clutter", "BOH pathways clear and safe for team movement", "Defined zones in place for footwear, apparel and accessories", "Separate zones maintained for receiving, returns, backstock and new arrivals", "Footwear organised by model, size and colour", "Footwear boxes aligned consistently and sizes arranged in the required Z-flow", "Apparel organised by category, size and colour", "Apparel clearly labelled and stored to the required folding standard?", "Shelves, boxes and stockroom zones clearly and consistently labelled", "Shopfloor products link clearly to the correct stockroom rack locations", "Receiving, return and replenishment areas tidy and controlled"]],
  ["Compliance & Safety", ["Immediate life-safety, security or operational hazards in the store", "Emergency exits, access routes and fire equipment physically unobstructed", "Stockroom racking, ladders and high-level storage safe and correctly positioned", "Electrical panels, sockets, cables and equipment free from visible safety risks", "Consumer and team areas free from slip, trip and obstruction hazards", "Previously reported incidents, hazards or safety actions been closed or actively followed up"]],
];
const QS = []; SECTIONS.forEach(([name, list], si) => list.forEach(text => QS.push({ id: "q" + (QS.length + 1), n: QS.length + 1, si, sec: name, text })));
const METRICS = ["Revenue", "Conversion", "ATV", "UPT", "Productivity (Revenue / FOH sqm / Month)", "Traffic", "Mystery Shopper", "Shrink%", "EBIT %"];
const SUMMARY = ["Key Strengths", "Key Opportunities", "Immediate Actions Agreed", "Support Required", "Store Manager / Leader Feedback", "Follow-up Required"];
const PRIOS = ["Critical", "High", "Medium", "Low"], STATI = ["Open", "In Progress", "Closed", "On Hold"];
const MAX_PHOTOS = 3;

/* ===================== helpers ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); const x = new Date(y, m - 1, d + n); return ymd(x); };
const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const fmtD = s => (s ? `${s.slice(8)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : "");
const longD = s => (s ? `${+s.slice(8)} ${MON[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}` : "");
const rid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g, "").replace(/%/g, "")); return isFinite(n) ? n : null; };
const clone = o => JSON.parse(JSON.stringify(o));
const pct = v => (v === null || v === undefined ? "–" : Math.round(v * 100) + "%");
const band = v => (v >= 0.9 ? ["On Point", "g"] : v >= 0.75 ? ["Focus Required", "a"] : ["Immediate Action", "r"]);
let toastT = null;
function toast(msg) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function ask(title, body, okLabel, cb, danger) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${body ? `<p class="muted">${esc(body)}</p>` : ""}<div class="row"><button class="btn alt grow" id="askNo">Cancel</button><button class="btn ${danger ? "bad" : ""} grow" id="askYes">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m); $("#askNo", m).onclick = () => m.remove(); $("#askYes", m).onclick = () => { m.remove(); cb(); };
}

/* ===================== scoring: the same sums as the Excel form ===================== */
function scoreOf(visit) {
  const ans = (visit && visit.ans) || {}, secs = SECTIONS.map(() => ({ y: 0, n: 0, na: 0, done: 0, total: 0 }));
  QS.forEach(q => { const s = secs[q.si], v = ans[q.id] && ans[q.id].v; s.total++; if (v) s.done++; if (v === "y") s.y++; else if (v === "n") s.n++; else if (v === "na") s.na++; });
  secs.forEach(s => { s.score = s.y + s.n ? s.y / (s.y + s.n) : 0; });
  const Y = secs.reduce((a, s) => a + s.y, 0), N = secs.reduce((a, s) => a + s.n, 0), done = secs.reduce((a, s) => a + s.done, 0);
  return { secs, y: Y, n: N, overall: Y + N ? Y / (Y + N) : 0, done, total: QS.length, any: Y + N > 0 };
}

/* ===================== data ===================== */
const S = { mode: "loading", ready: false, cfg: null, visits: {}, actions: {}, photos: {} };
let DB = null, ME = null;
const LS = "sv-local-v1";
const lsSave = () => { if (S.mode !== "local") return; try { localStorage.setItem(LS, JSON.stringify({ cfg: S.cfg, visits: S.visits, actions: S.actions })); } catch (e) {} };
const queues = {};
function qWrite(path, fn) { const p = (queues[path] || Promise.resolve()).then(fn).catch(e => { console.error("write failed", path, e); toast("Could not save. Check the connection and try again."); }); queues[path] = p; return p; }
function dataInit() {
  if (window.SB_FIREBASE && window.SB_FIREBASE.projectId && window.firebase) { try { firebase.initializeApp(window.SB_FIREBASE); DB = firebase.firestore(); } catch (e) { console.error(e); DB = null; } }
  if (!DB) { S.mode = "local"; try { const d = JSON.parse(localStorage.getItem(LS) || "null"); if (d) { S.cfg = d.cfg; S.visits = d.visits || {}; S.actions = d.actions || {}; } } catch (e) {} S.ready = true; render(); return; }
  S.mode = "cloud"; const err = e => { console.error("db", e); S.dbError = true; soft(); };
  setTimeout(() => { if (!S.ready) { S.slow = true; soft(); } }, 10000);
  DB.doc("sv_cfg/main").onSnapshot(s => { S.cfg = s.exists ? clone(s.data()) : null; if (!s.metadata.fromCache || s.exists) S.ready = true; soft(); }, err);
  DB.collection("sv_visit").onSnapshot(q => { const keep = W ? W.id : null; q.docChanges().forEach(c => { if (c.type === "removed") delete S.visits[c.doc.id]; else if (c.doc.id !== keep || !S.visits[keep]) S.visits[c.doc.id] = clone(c.doc.data()); }); soft(); }, err);
  DB.collection("sv_action").onSnapshot(q => { S.actions = {}; q.docs.forEach(d => { S.actions[d.id] = clone(d.data()); }); soft(); }, err);
}
const Data = {
  saveCfg(cfg) { S.cfg = clone(cfg); lsSave(); if (DB) return qWrite("cfg", () => DB.doc("sv_cfg/main").set(clone(cfg))); },
  saveVisit(id) { const v = S.visits[id]; if (!v) return; v.upd = Date.now(); lsSave(); if (DB) return qWrite("v" + id, () => DB.doc("sv_visit/" + id).set(clone(v))); },
  delVisit(id) { delete S.visits[id]; Object.entries(S.actions).filter(([, a]) => a.visit === id).forEach(([aid]) => Data.delAction(aid)); Object.keys(S.photos[id] || {}).forEach(pid => { if (DB) DB.doc("sv_photo/" + pid).delete().catch(() => {}); }); delete S.photos[id]; lsSave(); if (DB) return qWrite("v" + id, () => DB.doc("sv_visit/" + id).delete()); },
  saveAction(id, a) { S.actions[id] = clone(a); lsSave(); if (DB) return qWrite("a" + id, () => DB.doc("sv_action/" + id).set(clone(a))); },
  delAction(id) { delete S.actions[id]; lsSave(); if (DB) return qWrite("a" + id, () => DB.doc("sv_action/" + id).delete()); },
  async loadPhotos(visitId) { if (S.photos[visitId]) return S.photos[visitId]; S.photos[visitId] = {}; if (DB) { try { const q = await DB.collection("sv_photo").where("visit", "==", visitId).get(); q.docs.forEach(d => { S.photos[visitId][d.id] = d.data(); }); } catch (e) { console.error(e); toast("Photos could not be loaded."); } } return S.photos[visitId]; },
  savePhoto(visitId, pid, doc) { (S.photos[visitId] = S.photos[visitId] || {})[pid] = doc; if (DB) return qWrite("p" + pid, () => DB.doc("sv_photo/" + pid).set(doc)); },

      c.font = font(size, cl.bold || o.bold); c.fillStyle = cl.color || o.color || "#111"; c.textBaseline = "middle"; const al = cl.align || "left"; c.textAlign = al; const tx2 = al === "left" ? x + pad : al === "right" ? x + cl.w - pad : x + cl.w / 2; let ty = y + (h - lines[i].length * lh) / 2 + lh / 2; lines[i].forEach(l => { c.fillText(l, tx2, ty); ty += lh; }); x += cl.w; }); y += h; };

    newPage(); bar("PHOTOS"); y += 8; const cols = 3, gap = 9, bw = (IW - gap * (cols - 1)) / cols, bh = bw * 0.75, cap = 24;
    for (let i = 0; i < shots.length; i += cols) { need(bh + cap + 8); const y0 = y;
      for (let k = 0; k < cols && i + k < shots.length; k++) { const { q, p } = shots[i + k], x = M + k * (bw + gap), im = await loadImg(p.data);
        c.fillStyle = "#f2f2f2"; c.fillRect(x, y0, bw, bh); if (im) { const r = Math.min(bw / im.width, bh / im.height), w2 = im.width * r, h2 = im.height * r; c.drawImage(im, x + (bw - w2) / 2, y0 + (bh - h2) / 2, w2, h2); }
        c.strokeStyle = "#999"; c.lineWidth = 0.5; c.strokeRect(x, y0, bw, bh);
        const a = (v.ans[q.id] || {}).v; c.font = font(7.5, 1); c.fillStyle = a === "n" ? "#b3261e" : a === "y" ? "#1f7a45" : "#111"; c.textAlign = "left"; c.textBaseline = "middle"; c.fillText(`Q${q.n} · ${a === "y" ? "Yes" : a === "n" ? "No" : a === "na" ? "N.A" : ""}`, x, y0 + bh + 8);
        const l = wrap(q.text, font(6.8), bw); c.font = font(6.8); c.fillStyle = "#444"; c.fillText(l[0] + (l.length > 1 ? "…" : ""), x, y0 + bh + 17, bw); }
      y = y0 + bh + cap + 6; }
  }
  pages.forEach((cv, i) => { const x = cv.getContext("2d"); x.font = font(7); x.fillStyle = "#666"; x.textBaseline = "middle"; x.textAlign = "left"; x.fillText(`Store Visit Report · ${st.name || ""} · ${longD(v.date)}`, M, PH - 16); x.textAlign = "right"; x.fillText(`Page ${i + 1} of ${pages.length}`, PW - M, PH - 16); });
  return pages;
}
async function pagesToPdf(pages) {
  const { jsPDF } = window.jspdf; let doc = null;
  for (const cv of pages) { if (!doc) doc = new jsPDF({ unit: "pt", format: "a4", orientation: "portrait", compress: true }); else doc.addPage("a4", "portrait"); doc.addImage(cv.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 595.28, 841.89, undefined, "FAST"); await new Promise(r => setTimeout(r, 0)); }

}
function showReport(pages) {
